<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — ip2domain</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-page">
    <main class="auth-shell">
        <section class="glass-card auth-card">
            <div class="logo-badge">ip2domain</div>
            <h1>Вход в панель</h1>
            <p>Введите имя пользователя и пароль администратора.</p>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Имя пользователя</label>
                    <input id="username" name="username" type="text" autocomplete="username" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required>
                </div>
                <div id="login-error" class="auth-error" role="alert"></div>
                <button class="btn" type="submit">Войти</button>
            </form>
        </section>
    </main>
    <script>
    document.getElementById('login-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const error = document.getElementById('login-error');
        error.textContent = '';
        const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            })
        });
        if (response.ok) {
            window.location.replace('/');
        } else {
            error.textContent = 'Неверное имя пользователя или пароль';
        }
    });
    </script>
</body>
</html>
